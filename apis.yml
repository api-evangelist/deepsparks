name: DeepSparks
description: DeepSparks was a Bangkok, Thailand fintech offering a lending-as-a-service platform built
  on AI-driven alternative credit scoring. It analyzed non-traditional data to help financial institutions,
  microlenders, and enablers approve and acquire underbanked borrowers, and offered a data API, lead
  generation, and a rejected-applicant exchange. Founded in 2018 and backed by 500 Global and J Ventures,
  the company has since ceased operations (deadpooled); its official site at deepsparks.ai no longer resolves.
